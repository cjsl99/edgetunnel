name: 修补 _worker.js 测速拦截逻辑

on:
  workflow_dispatch: # 随时可以在 GitHub Actions 页面手动点击触发
  push:
    paths:
      - '_worker.js' # 只有当 _worker.js 被修改提交时，才自动触发运行

jobs:
  patch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 强制修补 _worker.js
        run: |
          python3 -c "
          import re

          with open('_worker.js', 'r', encoding='utf-8') as f:
              content = f.read()

          # 1. 替换所有调用处的参数传入：isSpeedTestSite(hostname) -> isSpeedTestSite(hostname, port)
          content = re.sub(r'\bisSpeedTestSite\(\s*hostname\s*\)', 'isSpeedTestSite(hostname, port)', content)

          # 2. 匹配并直接覆盖整个 isSpeedTestSite 函数体，确保包含 80 端口校验
          func_pattern = r'function\s+isSpeedTestSite\s*\([^)]*\)\s*\{[\s\S]*?\}'
          func_replace = (
              'function isSpeedTestSite(hostname, port) {\n'
              '	if (port != 80 || !hostname) return false;\n'
              '	const speedTestDomains = [\'speed.cloudflare.com\', \'cp.cloudflare.com\'];\n'
              '	hostname = hostname.toLowerCase();\n'
              '	return speedTestDomains.some(domain => hostname === domain || hostname.endsWith(\'.\' + domain));\n'
              '}'
          )

          content = re.sub(func_pattern, func_replace, content)

          with open('_worker.js', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: 保存修改并推送回仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            git add _worker.js
            git commit -m "fix: 修复 isSpeedTestSite 函数 80 端口拦截逻辑缺失 [skip ci]"
            git push
            echo "修改完成，已成功推送到仓库！"
          else
            echo "代码已是最终正确状态，无需重复提交。"
          fi
