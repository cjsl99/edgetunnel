name: 手动或推送时自动修补 _worker.js

on:
  workflow_dispatch: # 支持你在 Actions 页面手动点“Run workflow”随时执行
  push:             # 只要仓库有任何 Push 提交就执行（不限制修改了哪个文件）
    branches:
      - main        # 如果你的默认分支叫 master，这里改成 master

jobs:
  patch:
    runs-on: ubuntu-latest
    
    # 赋予 Action 向仓库提交代码的写权限
    permissions:
      contents: write

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 读取并修改 _worker.js
        run: |
          python3 -c "
          import re

          with open('_worker.js', 'r', encoding='utf-8') as f:
              content = f.read()

          # 1. 将所有 isSpeedTestSite(hostname) 替换为 isSpeedTestSite(hostname, port)
          content = re.sub(r'\bisSpeedTestSite\(\s*hostname\s*\)', 'isSpeedTestSite(hostname, port)', content)

          # 2. 修改函数定义，加入 port != 80 判断
          def_pattern = r'function\s+isSpeedTestSite\(\s*hostname\s*\)\s*\{'
          def_replace = 'function isSpeedTestSite(hostname, port) {\n\tif (port != 80) return false;'
          content = re.sub(def_pattern, def_replace, content)

          with open('_worker.js', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: 保存修改并推送回仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            git add _worker.js
            git commit -m "style: 自动对 _worker.js 应用 80 端口测速拦截补丁 [skip ci]"
            git push
            echo "修改完成，已自动推送到你的仓库！"
          else
            echo "当前 _worker.js 已经是修补后的状态，无需重复提交。"
          fi
